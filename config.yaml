experiment:
  name: "Bregman_nmPPMDC_Comparison"
  seed: 42
  device: "cpu"

dataset:
  name: "BSD68"
  raw_dir: "data/raw/BSD68"
  max_images: 3  # Keep low for instant verification

noise:
  type: "gaussian"
  sigma: 25

model:
  mu: 0.35        # Stronger TV regularization for visible noise reduction
  alpha: 5.0
  beta: 8.0     # Less aggressive edge damping so flat regions are denoised
  epsilon: 1.0e-4

optimizer:
  max_iter: 100   # Allow the regularized solution to develop fully
  tol: 1.0e-5
  gamma: 1.0e-4
  sigma_ls: 0.5
  M: 5
  step_size: 0.5

bregman:
  modes:
    - "euclidean"
    - "adaptive"

output:
  base_dir: "results"
  save_images: true
  save_metrics: true
  save_plots: true